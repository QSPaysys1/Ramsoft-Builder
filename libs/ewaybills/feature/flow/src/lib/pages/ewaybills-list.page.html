<div class="mx-auto max-w-6xl space-y-4 p-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-xl font-bold text-slate-900">E-Way Bills</h1>
    <div class="flex flex-wrap gap-2">
      <a
        routerLink="/home"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-800"
      >
        Home
      </a>
      <a
        routerLink="/ewaybills/update-part-b"
        class="rounded-lg border border-sky-200 bg-sky-50 px-3 py-2 text-sm font-semibold text-sky-900"
      >
        Update Part-B
      </a>
      <a
        routerLink="/ewaybills/create"
        class="rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white"
      >
        Create E-Way Bill
      </a>
    </div>
  </div>

  <lib-ewb-inline-alert [message]="store.listError()" kind="error" />
  <lib-ewb-inline-alert [message]="cancelSuccessMessage()" kind="success" />

  <lib-ewb-saved-bills-table
    [rows]="filteredRows()"
    [loading]="store.listLoading()"
    [emptyMessage]="listEmptyHint()"
    [showTransportFilters]="true"
    [transportFilter]="transportFilter()"
    [showUpdatePartB]="true"
    [showCancel]="true"
    [skipRowSelect]="true"
    (transportFilterChange)="onTransportFilterChange($event)"
    (cancelClick)="openCancelDialog($event)"
  />
</div>

@if (cancelTarget(); as target) {
  <div
    class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ewb-cancel-title"
  >
    <div class="w-full max-w-md rounded-xl bg-white shadow-xl">
      <div class="border-b border-slate-100 px-5 py-4">
        <h2 id="ewb-cancel-title" class="text-lg font-semibold text-slate-900">
          Cancel e-way bill
        </h2>
        <p class="mt-1 text-sm text-slate-600">
          EWB
          <span class="font-mono font-semibold text-slate-900">{{ target.ewbNumber }}</span>
          will be cancelled with GSTZen.
        </p>
      </div>
      <form
        [formGroup]="cancelForm"
        (ngSubmit)="submitCancel()"
        class="space-y-4 px-5 py-4"
      >
        <label class="block">
          <span class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-600">
            Reason
          </span>
          <select
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"
            formControlName="cancelRsnCode"
          >
            @for (opt of cancelReasons; track opt.code) {
              <option [ngValue]="opt.code">{{ opt.code }}. {{ opt.label }}</option>
            }
          </select>
        </label>
        <label class="block">
          <span class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-600">
            Remarks (optional, max 50 chars)
          </span>
          <input
            type="text"
            maxlength="50"
            placeholder="e.g. Vehicle details not updated"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"
            formControlName="cancelRmrk"
          />
        </label>

        <lib-ewb-inline-alert [message]="store.cancelError()" kind="error" />

        <div class="flex items-center justify-end gap-2 pt-2">
          <button
            type="button"
            class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-800 disabled:opacity-50"
            [disabled]="cancelInFlight()"
            (click)="closeCancelDialog()"
          >
            Close
          </button>
          <button
            type="submit"
            class="rounded-lg bg-rose-600 px-3 py-2 text-sm font-semibold text-white hover:bg-rose-700 disabled:opacity-60"
            [disabled]="cancelInFlight()"
          >
            {{ cancelInFlight() ? 'Cancelling…' : 'Confirm cancel' }}
          </button>
        </div>
        <p class="text-xs text-slate-500">
          Reference:
          <a
            class="underline"
            href="https://my.gstzen.in/docs/api/ewaybill-api/cancel-eway-bill/"
            target="_blank"
            rel="noreferrer"
            >GSTZen cancel e-way bill API</a
          >
        </p>
      </form>
    </div>
  </div>
}
