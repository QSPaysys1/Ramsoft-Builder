<div
  class="fixed top-0 right-0 left-0 z-[999] h-14 border-b border-white/10 bg-[#0b1e59] px-4 py-2 shadow-sm md:px-8"
>
  <div class="flex h-full w-full items-center justify-between">
    <a routerLink="/home" class="flex flex-1 items-center gap-1 outline-offset-2 focus-visible:outline-2 focus-visible:outline-white">
      <img
        class="h-10 w-auto max-w-[9rem] object-contain lg:max-w-[7.5rem]"
        src="assets/img/ramsoftmillersmelody.png"
        alt="Ramsoft"
      />
    </a>

    <div class="flex md:hidden">
      <button
        (click)="toggleMobileMenu()"
        type="button"
        class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-white hover:bg-white/10"
      >
        <span class="sr-only">Open main menu</span>
        <svg
          class="size-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
      </button>
    </div>

    <div class="hidden items-center gap-4 md:flex">
      <div
        class="rounded bg-white px-3 py-1 text-[10px] font-semibold tracking-wide text-[#0b1e59] lg:py-1.5 lg:text-xs"
      >
        Financial Year :
        <span>{{ fy() ?? '—' }}</span>
      </div>

      <label
        class="flex cursor-pointer items-center gap-1.5 rounded bg-white/10 px-2 py-1 text-[10px] font-medium text-white hover:bg-white/15 lg:px-2.5 lg:py-1.5 lg:text-xs"
      >
        <input
          type="checkbox"
          class="size-3.5 shrink-0 rounded border-white/40 text-[#0b1e59] focus:ring-2 focus:ring-white/50"
          [checked]="ewbGstinHeaderPrefs.includeGstinHeader()"
          (change)="onEwbGstinHeaderChange($event)"
        />
        <span>GSTZen gstin</span>
      </label>

      <label
        class="flex cursor-pointer items-center gap-1.5 rounded bg-white/10 px-2 py-1 text-[10px] font-medium text-white hover:bg-white/15 lg:px-2.5 lg:py-1.5 lg:text-xs"
        [class.opacity-50]="!ewbTestTokenAvailable()"
        [attr.title]="
          ewbTestTokenAvailable()
            ? 'Use e-way test token for standalone e-way POST only'
            : 'Set environment.gstZen.ewbTestToken to enable'
        "
      >
        <input
          type="checkbox"
          class="size-3.5 shrink-0 rounded border-white/40 text-[#0b1e59] focus:ring-2 focus:ring-white/50"
          [checked]="ewbTokenPrefs.useEwbTestToken()"
          [disabled]="!ewbTestTokenAvailable()"
          (change)="onEwbTestTokenChange($event)"
        />
        <span>EWB test token</span>
      </label>

      <button
        routerLink="/versions"
        type="button"
        class="min-w-20 cursor-pointer rounded bg-[#2c4e86] px-3 py-1 text-[10px] font-medium text-white shadow-sm hover:bg-[#2c4e86]/80 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 lg:py-1.5 lg:text-xs"
      >
        Versions
      </button>
      <button
        routerLink="/versions/issues"
        type="button"
        class="min-w-20 cursor-pointer rounded bg-[#2c4e86] px-3 py-1 text-[10px] font-medium text-white shadow-sm hover:bg-[#2c4e86]/80 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 lg:py-1.5 lg:text-xs"
      >
        Issues
      </button>

      <div class="relative shrink-0">
        <button
          type="button"
          id="user-menu-button"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="true"
          class="flex cursor-pointer items-center gap-3 rounded-md focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-[#0b1e59] focus:outline-none"
        >
          <span class="sr-only">Open user menu</span>
          @if (avatarUrl(); as src) {
            <img
              class="size-6 rounded-full ring-2 ring-white/30 lg:size-8"
              [src]="src"
              alt=""
            />
          } @else {
            <span
              class="flex size-6 items-center justify-center rounded-full bg-indigo-100 text-xs font-semibold text-[#0b1e59] ring-2 ring-white/30 lg:size-8 lg:text-sm"
            >
              {{ avatarInitial() }}
            </span>
          }
          <div class="text-left">
            <p class="text-[9px] text-gray-200 lg:text-[11px] lg:font-medium" style="color: #fff">
              Welcome
            </p>
            <p class="text-[10px] font-medium tracking-wide text-white lg:text-sm lg:font-semibold">
              {{ displayName() }}
            </p>
          </div>
        </button>

        @if (menuOpen()) {
          <div
            class="ring-black/5 absolute right-0 z-10 mt-2 w-64 origin-top-right divide-y divide-gray-200 overflow-hidden rounded-md bg-white shadow-lg ring-1 focus:outline-none"
            role="menu"
            aria-orientation="vertical"
            aria-labelledby="user-menu-button"
            tabindex="-1"
          >
            <a
              routerLink="/versions/myissues"
              class="block cursor-pointer px-4 py-3 text-sm font-semibold text-gray-800"
              role="menuitem"
              tabindex="-1"
              (click)="menuOpen.set(false)"
            >
              My Issues
            </a>
            <button
              type="button"
              class="block w-full cursor-pointer bg-gray-100 px-4 py-3 text-center text-sm font-semibold text-gray-800"
              role="menuitem"
              tabindex="-1"
              (click)="logout()"
            >
              Sign out
            </button>
          </div>
        }
      </div>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <div class="relative min-h-screen md:hidden" role="dialog" aria-modal="true">
      <button
        type="button"
        class="fixed inset-0 z-10 cursor-default bg-black/40"
        aria-label="Close menu"
        (click)="toggleMobileMenu()"
      ></button>
      <div
        class="fixed inset-y-0 right-0 z-20 flex w-full max-w-lg flex-col bg-[#0b1e59] shadow-xl sm:ring-1 sm:ring-gray-900/10"
      >
        <div
          class="fixed top-0 right-0 left-0 z-20 flex items-center justify-between border-b border-gray-600 p-[14px] px-4 shadow-sm"
        >
          <a routerLink="/home" (click)="mobileMenuOpen.set(false)">
            <img
              class="h-10 w-auto max-w-[5rem] object-contain"
              src="assets/img/ramsoftmillersmelody.png"
              alt="Ramsoft"
            />
          </a>

          <button
            (click)="toggleMobileMenu()"
            type="button"
            class="rounded-md text-gray-300 hover:text-white"
          >
            <span class="sr-only">Close menu</span>
            <svg
              class="size-6 text-white"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18 18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div class="relative mt-20 mb-24 flex-1 overflow-y-auto">
          <div class="-my-6 divide-y divide-gray-500/10">
            <label
              class="flex w-full cursor-pointer items-center gap-3 border-b border-gray-600 p-4 text-left text-[15px] font-semibold tracking-wider text-white hover:bg-white/5"
            >
              <input
                type="checkbox"
                class="size-4 shrink-0 rounded border-white/40 text-[#0b1e59]"
                [checked]="ewbGstinHeaderPrefs.includeGstinHeader()"
                (change)="onEwbGstinHeaderChange($event)"
              />
              <span>GSTZen gstin header</span>
            </label>
            <label
              class="flex w-full cursor-pointer items-center gap-3 border-b border-gray-600 p-4 text-left text-[15px] font-semibold tracking-wider text-white hover:bg-white/5"
              [class.opacity-50]="!ewbTestTokenAvailable()"
            >
              <input
                type="checkbox"
                class="size-4 shrink-0 rounded border-white/40 text-[#0b1e59]"
                [checked]="ewbTokenPrefs.useEwbTestToken()"
                [disabled]="!ewbTestTokenAvailable()"
                (change)="onEwbTestTokenChange($event)"
              />
              <span>EWB test token</span>
            </label>
            <button
              type="button"
              (click)="navigateTo('/home')"
              class="w-full border-b border-gray-600 p-4 text-left text-[15px] font-semibold tracking-wider text-white hover:bg-white/5"
            >
              Home
            </button>
            <button
              type="button"
              (click)="navigateTo('/e-invoices/create')"
              class="w-full border-b border-gray-600 p-4 text-left text-[15px] font-semibold tracking-wider text-white hover:bg-white/5"
            >
              E-Invoices
            </button>
            <button
              type="button"
              (click)="navigateTo('/versions')"
              class="w-full border-b border-gray-600 p-4 text-left text-[15px] font-semibold tracking-wider text-white hover:bg-white/5"
            >
              Versions
            </button>
            <button
              type="button"
              (click)="navigateTo('/versions/issues')"
              class="w-full border-b border-gray-600 p-4 text-left text-[15px] font-semibold tracking-wider text-white hover:bg-white/5"
            >
              Issues
            </button>
          </div>
        </div>

        <div class="fixed bottom-0 flex w-full items-center bg-white shadow-[0_-4px_16px_rgba(0,0,0,0.08)]">
          <button
            type="button"
            (click)="logout()"
            class="w-full cursor-pointer bg-blue-600 p-4 text-sm font-semibold tracking-wider text-white hover:bg-blue-700"
          >
            Sign out
          </button>
        </div>
      </div>
    </div>
  }
</div>
