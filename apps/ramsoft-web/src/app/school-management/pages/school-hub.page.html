@if (activeMenu(); as menu) {
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">{{ menu.title }}</h1>
    <p class="mt-2 text-sm text-slate-600">{{ menu.purpose }}</p>
    <p class="mt-4 text-sm text-slate-500">
      Select a module from the menu on the left to get started.
    </p>
  </div>
}
